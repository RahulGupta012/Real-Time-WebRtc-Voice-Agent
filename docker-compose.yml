services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    env_file:
      - .env

    expose:
      - "7860"

    volumes:
      - ./logs:/app/logs

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro

    depends_on:
      - backend

    restart: unless-stopped
