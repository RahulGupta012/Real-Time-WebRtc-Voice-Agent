server {
    listen 80;
    server_name rahul-voiceagent.duckdns.org;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name rahul-voiceagent.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/rahul-voiceagent.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rahul-voiceagent.duckdns.org/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:7860;

        proxy_http_version 1.1;

        # Needed for WebSocket/WebRTC signaling upgrades
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
